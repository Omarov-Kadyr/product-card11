<!DOCTYPE html> 
<html>
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mousse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="data:,">
  </head>
  <body>
    <main class="catalog">
      <div class="container catalog__container">
        <h1 class="title catalog__title">Выбери свой продукт</h1>
        <button id="change-Color-all-card">Cменить цвет всех карточек</button>
        <button id="change-Color-first-card">Cменить цвет первой карточки</button>
        <button id="open-google">Открыть страницу Google.com</button>
        <button id="output-console-log">Вывести собщение в консоль лог</button>
        
        <ul class="products clear-list"></ul>
        
        <template id="card-template">
          <li class="products__item card">
            <img src="" alt="" class="card__image"/>
            <span class="card__name"></span>
            <h2 class="card__title"></h2>
            <p class="card__text"></p>
            <div class="card__comound compound">
              <span class="card__name">Состав:</span>
              <ul class="card__list"></ul>
            </div>
            <div class="card__price">
              <b>Цена:</b>
              <span></span>
            </div>
          </li>
        </template>
      </div>
    </main>

    <footer>
      <p>Что бы получать уведомления об обновлениях нашего товара, подпишись</p>
      <form id="subscribe-form">
        <input placeholder="Введите свой email" name="email" type="email" required>
        <button type="submit">Подписаться</button>
      </form>
      <p>Что бы получить полный доступ к сайту пройдите регистрацию</p>
      <button class="open_registration" type="button">Зарегистрироваться</button>
    </footer>

    <div class="overlay">
      <div class="modal">
        <form class="form" id="email-form">
          <label>Имя<input placeholder="введите свое имя" name="name" required></label>
          <label>Фамилия<input placeholder="Введите свою фамилию" name="surname" required></label>
          <label>email<input placeholder="Введите свой email" name="email" type="email" required></label>
          <label>Пароль<input placeholder="Придумайте пароль" name="password" type="password" required></label>
          <label>Подтвердите пароль<input placeholder="Подтвердите пароль" name="repeatPassword" type="password" required></label>
          <button type="submit">Регистрация</button>
        </form>
        <button class="modal_close" type="button">Закрыть</button>
      </div>
    </div>

    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script type="module" src="homework-9.js"></script>
    <script type="module" src="homework-10.js"></script>
    <script type="module" src="homework-11.js"></script>
  </body>
</html>
